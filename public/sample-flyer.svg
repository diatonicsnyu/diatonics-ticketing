<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100" role="img" aria-label="Sample concert flyer">
  <!-- Placeholder flyer for demo mode only. Real flyers are uploaded per event in admin. -->
  <rect width="850" height="1100" fill="#eef6fc"/>
  <rect x="30" y="30" width="790" height="1040" fill="none" stroke="#7b1e2e" stroke-width="4"/>
  <rect x="44" y="44" width="762" height="1012" fill="none" stroke="#7b1e2e" stroke-width="1.5"/>

  <rect x="560" y="70" width="220" height="44" fill="#a9d6f5"/>
  <text x="670" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#1a1a1f">SAMPLE FLYER</text>

  <text x="425" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" letter-spacing="10" fill="#545460">THE DIATONICS PRESENT</text>
  <text x="425" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="6" fill="#7b1e2e">WINTER</text>
  <text x="425" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="6" fill="#7b1e2e">CONCERT</text>

  <!-- soundwave -->
  <g fill="#7b1e2e" opacity="0.85">
    <rect x="245" y="585" width="12" height="30"/><rect x="270" y="570" width="12" height="60"/>
    <rect x="295" y="550" width="12" height="100"/><rect x="320" y="530" width="12" height="140"/>
    <rect x="345" y="560" width="12" height="80"/><rect x="370" y="520" width="12" height="160"/>
    <rect x="395" y="545" width="12" height="110"/><rect x="420" y="510" width="12" height="180"/>
    <rect x="445" y="545" width="12" height="110"/><rect x="470" y="520" width="12" height="160"/>
    <rect x="495" y="560" width="12" height="80"/><rect x="520" y="530" width="12" height="140"/>
    <rect x="545" y="550" width="12" height="100"/><rect x="570" y="570" width="12" height="60"/>
    <rect x="595" y="585" width="12" height="30"/>
  </g>

  <text x="425" y="790" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1a1a1f">Saturday, December 5 · 6 PM</text>
  <text x="425" y="850" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#1a1a1f">St. Mark's Church in-the-Bowery</text>
  <text x="425" y="892" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#545460">131 E 10th St, New York, NY</text>

  <rect x="225" y="945" width="400" height="66" fill="#7b1e2e"/>
  <text x="425" y="988" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="3" fill="#ffffff">TICKETS $5.50 ONLINE</text>
</svg>
